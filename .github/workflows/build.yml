name: Build and release

on:
  push:
    branches: ['**']
    tags: ['[0-9]*.[0-9]*.[0-9]*', 'v[0-9]*.[0-9]*.[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect toolchain
        run: xcodebuild -version
      - name: Test release tooling
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Prepare build version
        id: release
        run: python3 scripts/release.py prepare
      - name: Build universal release app
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
          APP_BUILD: ${{ steps.release.outputs.build }}
        run: |
          set -euo pipefail
          python3 scripts/ci_xcodebuild.py --log "$RUNNER_TEMP/isp-release.log" -- \
            xcodebuild -project 'Input Source Pro.xcodeproj' -scheme 'Input Source Pro' \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/isp-release" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            CURRENT_PROJECT_VERSION="$APP_BUILD" MARKETING_VERSION="$APP_VERSION" build
      - name: Stage release app
        run: >-
          python3 scripts/ci_xcodebuild.py --log "$RUNNER_TEMP/isp-stage.log" --
          ditto "$RUNNER_TEMP/isp-release/Build/Products/Release/Input Source Pro.app" 'dist/Input Source Pro.app'
      - name: Verify app signatures
        run: >-
          python3 scripts/ci_xcodebuild.py --log "$RUNNER_TEMP/isp-signatures.log" --
          codesign --verify --deep --strict 'dist/Input Source Pro.app'
      - name: Validate offline app bundle
        run: >-
          python3 scripts/ci_xcodebuild.py --log "$RUNNER_TEMP/isp-bundle.log" --
          python3 scripts/release.py check-bundle
      - name: Verify universal app architecture
        run: >-
          python3 scripts/ci_xcodebuild.py --log "$RUNNER_TEMP/isp-architectures.log" --
          lipo 'dist/Input Source Pro.app/Contents/MacOS/Input Source Pro' -verify_arch arm64 x86_64
      - name: Check preview layout
        run: >-
          python3 scripts/ci_xcodebuild.py --log "$RUNNER_TEMP/isp-preview.log" --
          xcodebuild -project 'Input Source Pro.xcodeproj' -scheme 'Input Source Pro'
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/isp-tests" -resultBundlePath "$RUNNER_TEMP/isp-preview.xcresult"
          -only-testing:Tests/IndicatorPreviewLayoutTests
          CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= test
      - name: Build and test app
        run: >-
          python3 scripts/ci_xcodebuild.py --log "$RUNNER_TEMP/isp-tests.log" --
          xcodebuild -project 'Input Source Pro.xcodeproj' -scheme 'Input Source Pro'
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/isp-tests" -resultBundlePath "$RUNNER_TEMP/isp-tests.xcresult"
          CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= test
      - name: Package app
        env:
          ASSET: ${{ steps.release.outputs.asset }}
        run: >-
          python3 scripts/ci_xcodebuild.py --log "$RUNNER_TEMP/isp-package.log" --
          ditto -c -k --sequesterRsrc --keepParent 'dist/Input Source Pro.app' "dist/$ASSET"
      - name: Write package checksum
        run: >-
          python3 scripts/ci_xcodebuild.py --log "$RUNNER_TEMP/isp-checksum.log" --
          python3 scripts/release.py checksum
      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Input-Source-Pro-macOS-universal
          path: |
            dist/*.zip
            dist/*.sha256
            dist/release.json
          if-no-files-found: error
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macOS-test-results
          path: |
            ${{ runner.temp }}/isp-tests.xcresult
            ${{ runner.temp }}/isp-preview.xcresult
            ${{ runner.temp }}/isp-*.log
          if-no-files-found: ignore
    outputs:
      publish: ${{ steps.release.outputs.publish }}
  release:
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Input-Source-Pro-macOS-universal
          path: dist
      - name: Restore approved release notes
        run: python3 scripts/release.py prepare
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish
